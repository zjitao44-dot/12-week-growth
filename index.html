function openDatabase(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window)){resolve(null);return}const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains(DB_STORE))d.createObjectStore(DB_STORE)};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});}

function writeIndexedDB(obj){return new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).put(obj,'main');tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)});}

function hasDayEntry(s){const d=day(s);return Object.entries(d).some(([k,v])=>!['note','nextAction'].includes(k)&&v!==''&&v!==false&&v!=null)||Boolean(d.note)||Boolean(d.nextAction)||Boolean(workout(s).completed)||Boolean(workout(s).exercises&&Object.keys(workout(s).exercises).length);}
function dayFinished(s){return day(s).dailyMarked===true}
function streakInfo(){const edge=TODAY>END?END:TODAY<START?START:TODAY;let d=edge;if(!dayFinished(d)&&daysBetween(d,START)>0)d=add(d,-1);let streak=0;while(d>=START&&dayFinished(d)){streak++;d=add(d,-1)}const completed=Array.from({length:84},(_,i)=>add(START,i)).filter(dayFinished).length;return {streak,completed}}

function parse(s){let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)}
function ymd(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function add(s,n){const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)}
function daysBetween(a,b){return Math.round((parse(a)-parse(b))/86400000)}
function getWeek(s){const x=Math.floor(daysBetween(s,START)/7)+1;return x>=1&&x<=12?x:0}
function weekAt(w){return add(START,(w-1)*7)}
function weekDays(w){return Array.from({length:7},(_,i)=>add(weekAt(w),i))}
function weekNumLabel(w){return w?'W'+String(w).padStart(2,'0'):'计划外'}
function fmt(s){const d=parse(s);return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 · ${DAYS[d.getDay()]}`}
function safe(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function clamp(n,l,h){return Math.max(l,Math.min(h,n))}
function load(){try{const v=JSON.parse(localStorage.getItem(STORE));if(v&&v.version===1&&typeof v.days==='object'&&typeof v.workouts==='object')return v;}catch(e){}return {version:1,days:{},workouts:{},review:{},learn:{}}}

function n(v){const a=Number(v);return v!==''&&v!=null&&Number.isFinite(a)?a:null}
function average(xs){return xs.length?xs.reduce((a,b)=>a+b,0)/xs.length:null}
function printVal(v,d=1){return v==null?'—':Number(v).toFixed(d)}

function timesCompleted(w){return weekDays(w).filter(s=>workout(s).completed===true).length}

p></div><div class="hero-num"><strong>${recDone}</strong><span>已记录完成组数</span></div></div></div>

function plot(points,{suffix='',minZero=false}={}){const values=points.filter(v=>v!==null);if(!values.length)return `<div class="empty">尚无记录。开始填写每日数据后，这里会自动出现趋势。</div>`;const lo=minZero?0:Math.floor(Math.min(...values)-1),hi=Math.max(...values)+1,span=Math.max(1,hi-lo);const W=690,H=200,left=43,right=18,top=20,bottom=28;const px=i=>left+(W-left-right)*(i/Math.max(1,points.length-1)),py=v=>top+(H-top-bottom)*(1-(v-lo)/span);const line=points.map((v,i)=>v===null?null:`${px(i)},${py(v)}`).filter(Boolean).join(' ');let path='',has=false;points.forEach((v,i)=>{if(v==null){has=false;return}path+=(has?' L ':' M ')+px(i)+' '+py(v);has=true});const grid=Array.from({length:4},(_,i)=>{const y=top+(H-top-bottom)*i/3,val=hi-(span*i/3);return `<line x1="${left}" y1="${y}" x2="${W-right}" y2="${y}" stroke="#e8eeed"/><text x="${left-8}" y="${y+4}" font-size="10" fill="#81969a" text-anchor="end">${round(val,1)}</text>`}).join('');const dots=points.map((v,i)=>v===null?'':`<circle cx="${px(i)}" cy="${py(v)}" r="4" fill="#24877e"><title>${i+1}周：${round(v,1)}${suffix}</title></circle>`).join('');const ticks=points.map((_,i)=>`<text x="${px(i)}" y="${H-5}" font-size="9" fill="#82979a" text-anchor="middle">${i+1}</text>`).join('');return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="12周趋势图">${grid}<path d="${path}" fill="none" stroke="#288a80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${dots}${ticks}</svg>`;}
function renderWeekly(){const trainVals=Array.from({length:12},(_,i)=>timesCompleted(i+1));const rows=Array.from({length:12},(_,i)=>{const w=i+1,s=weekAt(w);const sleep=weekVal(w,'sleep'),weight=weekVal(w,'weight'),waist=weekLastWaist(w),mins=studyMinutes(w);return `<tr><td><b>W${String(w).padStart(2,'0')}</b><div class="small-muted">${s.slice(5)}–${add(s,6).slice(5)}</div></td><td><b>${timesCompleted(w)}</b> / 4</td><td>${weight!=null?round(weight,2)+' kg':'—'}</td><td>${waist!=null?round(waist,1)+' cm':'—'}</td><td>${sleep!=null?round(sleep,1)+' h':'—'}</td><td>${mins} min</td><td>${learn(w).done?'✓ 完成':'—'}</td></tr>`}).join('');const reviewPrompts=[[4,'有没有稳定训练？睡眠是否增加？动作是否熟悉？首批剪辑是否完成？'],[8,'腰围和力量如何变化？平均睡眠与活动量有没有改善？'],[12,'是否形成了系统？回顾精力、训练、腰围和最终作品。']];return `<div class="hero"><div class="hero-inner"><div><div class="hero-tag">TRACK & ADJUST / 12 WEEKS</div><h2>只看趋势，不看一天的成败</h2><p>每周日填写一次；每四周做一次复盘。你已经开始记录的每一天都有意义。</p></div><div class="hero-num"><strong>12</strong><span>周进度表</span></div></div></div>

function renderCalendar(){const overall=streakInfo();const weeks=Array.from({length:12},(_,i)=>{const w=i+1;const ds=weekDays(w);const complete=ds.filter(dayFinished).length;return `<section class="cal-week"><div class="cal-week-head"><div><b>W${String(w).padStart(2,'0')}</b><span>${ds[0].slice(5).replace('-','/')} — ${ds[6].slice(5).replace('-','/')}</span></div><small>${complete}/7 天完成</small></div><div class="cal-days">${ds.map((s,i)=>{const done=dayFinished(s),partial=hasDayEntry(s);const sc=todaySchedule(s);return `<button class="cal-day ${done?'is-complete':partial?'is-partial':''} ${s===TODAY?'is-today':''} ${s===selected?'is-selected':''}" data-go-date="${s}" aria-label="${safe(s)} ${done?'已完成':partial?'有记录':'未记录'}"><span class="cal-day-name">${['一','二','三','四','五','六','日'][i]}</span><strong>${parse(s).getDate()}</strong><i>${done?'✓':partial?'·':''}</i></button>`}).join('')}</div></section>`}).join('');return `<section class="hero"><div class="hero-inner"><div><div class="hero-tag">12 WEEK CALENDAR / 84 DAYS</div><h2>每一格，都是你走过的一天</h2><p>点任意日期编辑历史记录；绿色代表已点击「完成今日打卡」，淡色代表有记录但尚未确认完成。</p></div><div class="hero-num"><strong>${overall.completed}</strong><span>/ 84 天</span></div></div></section><div class="cal-key"><span><i class="key-done"></i>完成打卡</span><span><i class="key-partial"></i>有记录</span><span><i class="key-blank"></i>未记录</span></div><div class="cal-grid">${weeks}</div><div class="notice wide-space">连续打卡 ${overall.streak} 天。允许休息日打卡：只需记录当天饮食、睡眠或复盘，再点「完成今日打卡」。</div>`;}
function renderMore(){return `<div class="hero"><div class="hero-inner"><div><div class="hero-tag">MY GROWTH / PERSONAL HUB</div><h2>让成长有迹可循</h2><p>你的训练、恢复、剪辑能力和每周记录，都可以在这里整理。</p></div></div></div><div class="more-grid"><button class="more-tile" data-goto="learning"><span class="more-symbol">◈</span><b>达芬奇学习</b><small>12周课程 · 每周作品 · 学习时长</small><span class="more-arrow">↗</span></button><button class="more-tile" data-goto="weekly"><span class="more-symbol">▤</span><b>成长复盘</b><small>体重与睡眠趋势 · W04/08/12 复盘</small><span class="more-arrow">↗</span></button><button class="more-tile" data-goto="data"><span class="more-symbol">⇩</span><b>数据与备份</b><small>导出、恢复、迁移和设备数据保护</small><span class="more-arrow">↗</span></button><button class="more-tile" data-goto="calendar"><span class="more-symbol">▦</span><b>12周日历</b><small>84天总览 · 修改任何历史记录</small><span class="more-arrow">↗</span></button></div><div class="install-card"><b>📱 添加到手机桌面</b><p>首次访问需要 HTTPS。iPhone 在 Safari 中点击分享 → 添加到主屏幕；Android 在 Chrome 菜单中选择安装应用。安装后将缓存资源，可离线打开和打卡。</p><button class="btn btn-primary" id="install-app" hidden>安装到桌面</button><p class="small-muted">数据不会自动同步手机和电脑。请定期通过「数据与备份」导出 JSON 文件。</p></div>`;}
function renderData(){const days=Object.keys(data.days).length,train=Object.values(data.workouts).filter(w=>w.completed).length;let stored='—';try{stored=(new Blob([JSON.stringify(data)]).size/1024).toFixed(1)+' KB'}catch(e){}return `<section class="hero"><div class="hero-inner"><div><div class="hero-tag">PRIVACY / LOCAL FIRST</div><h2>你的记录，你自己保管</h2><p>安装后可离线使用。记录保存在当前设备的本地数据库中，并在可用时保存浏览器本地副本。</p></div><div class="hero-num"><strong>${days}</strong><span>天已填写记录</span></div></div></section>
<div class="metrics"><div class="panel metric"><div class="metric-label">已写每日记录</div><div class="metric-value">${days}<span>天</span></div></div><div class="panel metric"><div class="metric-label">已完成训练</div><div class="metric-value">${train}<span>次</span></div></div><div class="panel metric"><div class="metric-label">已完成学习周</div><div class="metric-value">${Object.values(data.learn).filter(x=>x.done).length}<span>周</span></div></div><div class="panel metric"><div class="metric-label">本地数据大小</div><div class="metric-value">${stored.split(' ')[0]}<span>KB</span></div></div></div>
<div class="section-grid equal"><section class="panel panel-inner"><div class="panel-heading"><div><h2 class="card-title">导出备份</h2><p class="card-sub">每周导出一次 JSON 文件，换电脑或清除浏览器数据时可恢复。</p></div></div><div class="backup-actions"><button class="btn btn-primary" id="export-json">↓ 下载 JSON 备份</button><button class="btn" id="export-csv">↓ 导出每日 CSV</button></div><p class="small-muted">JSON 可完整恢复；CSV 适合 Excel 分析，包含每日数值与打卡状况。</p></section><section class="panel panel-inner"><div class="panel-heading"><div><h2 class="card-title">导入恢复</h2><p class="card-sub">从之前导出的本网站 JSON 文件恢复全部记录。</p></div></div><div class="backup-actions"><button class="btn" id="import-json">↑ 选择 JSON 文件</button></div><p class="small-muted">导入会替换当前本地记录，操作前建议先导出备份。</p></section></div>
<div class="wide-space">${panel('使用说明与数据安全','首次需通过 HTTPS 加载/安装；缓存成功后可离线工作。',`<div class="hintline">本地存储与网站来源、浏览器绑定。切换域名、浏览器、设备，或清理网站数据，均可能使记录无法访问。迁移时请导出并导入 JSON 备份。</div><div class="divider"></div><div class="hintline">不提供跨设备同步、账号登录、云备份或自动提醒；打卡数据不会主动上传到服务器。首次安装或更新静态文件需联网。</div><div class="divider"></div><div class="hintline">以原始12周手册为内容依据，日期固定2026年10月12日至2027年1月3日。睡眠安全提醒和训练阶段安排沿用手册。</div><div class="divider"></div><button class="btn btn-danger" id="clear-data">清空全部本地记录</button>`)}</div>`;}
function setWorkoutField(k,val){data.workouts[selected]={...workout(),type:workout().type||todaySchedule().type,[k]:val};save()}
function setSet(id,j,field,val){const wo={...workout()},type='ABCD'.includes(wo.type)?wo.type:('ABCD'.includes(todaySchedule().type)?todaySchedule().type:'A');wo.type=type;wo.exercises={...(wo.exercises||{})};const ex={...(wo.exercises[id]||{})};const sets=[...(ex.sets||[])];sets[j]={...(sets[j]||{}),[field]:val};ex.sets=sets;wo.exercises[id]=ex;data.workouts[selected]=wo;save()}
function setRir(id,val){const wo={...workout()};wo.type=wo.type||todaySchedule().type;wo.exercises={...(wo.exercises||{})};wo.exercises[id]={...(wo.exercises[id]||{}),rir:val};data.workouts[selected]=wo;save()}
function download(name,text,mime){const blob=new Blob([text],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2500)}
function exportCSV(){const headers=['日期','周数','当天安排','体重kg','腰围cm','睡眠h','蛋白质g','精神1-5','学习分钟','学习完成','训练类型','训练完成','训练时长分钟','备注'];const dates=[...new Set([...Object.keys(data.days),...Object.keys(data.workouts)])].sort();const quote=x=>'"'+String(x??'').replace(/"/g,'""')+'"';const lines=dates.map(s=>{const d=day(s),wo=workout(s);return [s,getWeek(s)||'',todaySchedule(s).title,d.weight,d.waist,d.sleep,d.protein,d.energy,d.studyMinutes,d.study?'是':'否',wo.type||'',wo.completed?'是':'否',wo.duration||'',d.note||''].map(quote).join(',')});download('12周打卡_每日记录_'+TODAY+'.csv','\ufeff'+headers.map(quote).join(',')+'\r\n'+lines.join('\r\n'),'text/csv;charset=utf-8')}
function handleAction(e){const nav=e.target.closest('[data-view]');if(nav){view=nav.dataset.view;render();window.scrollTo(0,0);return}const go=e.target.closest('[data-goto]');if(go){view=go.dataset.goto;render();window.scrollTo(0,0);return}const dt=e.target.closest('[data-go-date]');if(dt){selected=dt.dataset.goDate;view='daily';render();window.scrollTo(0,0);return}const wk=e.target.closest('[data-learn-week]');if(wk){learningWeek=Number(wk.dataset.learnWeek);render();return}if(e.target.matches('[data-mark-day]')){setCompletedDay(e.target.dataset.markDay,!dayFinished(e.target.dataset.markDay));return}if(e.target.id==='complete-workout'){setTask(selected,'training',!workout().completed);return}if(e.target.id==='export-json'){download('12周成长打卡_完整备份_'+TODAY+'.json',JSON.stringify({...data,exportedAt:new Date().toISOString()},null,2),'application/json');toast('备份已下载');return}if(e.target.id==='export-csv'){exportCSV();toast('CSV 已下载');return}if(e.target.id==='import-json'){document.getElementById('import-file').click();return}if(e.target.id==='clear-data'){if(window.confirm('确定清空全部本地打卡、训练、学习和复盘数据吗？此操作不可撤销，建议先导出备份。')){localStorage.removeItem(STORE);data={version:1,days:{},workouts:{},review:{},learn:{}};save();render();toast('记录已清空')}return}}
function handleChange(e){let t=e.target;if(t.matches('[data-task]')){setTask(selected,t.dataset.task,t.checked);return}if(t.matches('[data-day-field]')){setDay(selected,t.dataset.dayField,t.value);return}if(t.matches('[data-workout-field]')){setWorkoutField(t.dataset.workoutField,t.value);return}if(t.matches('[data-set-done]')){const [id,j]=t.dataset.setDone.split(':');setSet(id,Number(j),'done',t.checked);t.closest('.set')?.classList.toggle('completed',t.checked);return}if(t.matches('[data-set]')){const [id,j,field]=t.dataset.set.split(':');setSet(id,Number(j),field,t.value);return}if(t.matches('[data-rir]')){setRir(t.dataset.rir,t.value);return}if(t.matches('[data-learn-done]')){let w=+t.dataset.learnDone;data.learn[w]={...learn(w),done:t.checked};save();render();return}if(t.matches('[data-learn-note]')){let w=+t.dataset.learnNote;data.learn[w]={...learn(w),note:t.value};save();return}if(t.matches('[data-review]')){data.review[t.dataset.review]=t.value;save();return}if(t.id==='training-type'){data.workouts[selected]={...workout(),type:t.value};save();render();return}}
document.addEventListener('click',handleAction);document.getElementById('content').addEventListener('change',handleChange);
let inputTimer=null;document.getElementById('content').addEventListener('input',e=>{const el=e.target;if(!el.matches('[data-day-field],[data-workout-field],[data-set],[data-rir],[data-learn-note],[data-review]'))return;clearTimeout(inputTimer);const date=selected;const key=el.dataset.dayField||el.dataset.workoutField||el.dataset.set||el.dataset.rir||el.dataset.learnNote||el.dataset.review;const val=el.value;inputTimer=setTimeout(()=>{if(date!==selected||!el.isConnected)return;handleChange({target:el});},420);});document.getElementById('prev-day').onclick=()=>{selected=add(selected,-1);render()};document.getElementById('next-day').onclick=()=>{selected=add(selected,1);render()};document.getElementById('today-btn').onclick=()=>{selected=TODAY;render()};document.getElementById('pick-day').onchange=e=>{if(e.target.value){selected=e.target.value;render()}};
document.getElementById('import-file').addEventListener('change',async e=>{const file=e.target.files?.[0];e.target.value='';if(!file)return;try{if(file.size>5000000)throw Error('文件过大');const imported=JSON.parse(await file.text());if(imported.version!==1||!imported.days||!imported.workouts||!imported.learn||!imported.review||Array.isArray(imported.days))throw Error('不是有效的本站备份');if(!confirm('导入备份会覆盖目前的全部记录，确定继续吗？'))return;data={version:1,days:imported.days,workouts:imported.workouts,review:imported.review,learn:imported.learn};save();render();toast('备份导入成功')}catch(err){alert('导入失败：'+err.message)}});
// Start on today, preserving the existing localStorage dataset and migrating to IndexedDB where supported.
render();initStorage();
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost' || location.hostname==='127.0.0.1')){
window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('Offline worker unavailable',err)));
}
let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;const b=document.getElementById('install-app');if(b)b.hidden=false;});
window.addEventListener('appinstalled',()=>{deferredInstall=null;toast('已安装到桌面')});
document.addEventListener('click',async e=>{if(e.target.id==='install-app'&&deferredInstall){deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;const b=document.getElementById('install-app');if(b)b.hidden=true;}});

})();
</script>
</body></html>
